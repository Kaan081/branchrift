name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build package
        run: python -m build

      - name: Confirm branchrift distribution
        run: |
          python - <<'PY'
          from pathlib import Path
          wheels = sorted(Path("dist").glob("branchrift-*.whl"))
          sdists = sorted(Path("dist").glob("branchrift-*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(
                  f"expected one branchrift wheel and sdist, found {wheels} {sdists}"
              )
          print(wheels[0])
          print(sdists[0])
          PY

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1