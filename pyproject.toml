[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-preflight"
version = "0.1.9"
description = "Read-only Git integration preflight and repository governance CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  {name = "Kaan081"}
]
dependencies = []

keywords = [
  "git",
  "git-lfs",
  "pre-merge",
  "pre-integration",
  "developer-tools",
  "code-ownership",
  "repository-governance",
  "unreal-engine",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
preflight = "preflight.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/Kaan081/repo-preflight"
Repository = "https://github.com/Kaan081/repo-preflight"
Issues = "https://github.com/Kaan081/repo-preflight/issues"
Changelog = "https://github.com/Kaan081/repo-preflight/blob/main/CHANGELOG.md"
